; PlatformIO project for the Human-Detecting Lights controller.
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Arduino-ESP32 core 2.x: the firmware uses the ledcSetup/ledcAttachPin API,
; which was removed in core 3.x.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; KasaSmartPlug's error logging uses a TAG it never defines; give it one.
build_flags = -DTAG=\"KasaSmartPlug\"
lib_deps =
    https://github.com/kj831ca/KasaSmartPlug.git#7510ad078a88da4b103081a7f9a6a9c3536e96de
    bblanchon/ArduinoJson@^6.21.5   ; KasaSmartPlug uses the v6 API
